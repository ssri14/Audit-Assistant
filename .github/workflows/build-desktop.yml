name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-Apple-Silicon
            runner: macos-15
            architecture: arm64
          - name: Windows-x64
            runner: windows-2022
            architecture: x64
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run workflow and UI tests
        run: python -m unittest discover -s tests -v
      - name: Build native package and checksum
        run: python build_package.py
      - name: Test actual packaged application
        run: python verify_package.py
      - name: Upload installer and checksum
        uses: actions/upload-artifact@v7
        with:
          name: AuditAssistant-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  draft-release:
    name: Assemble draft pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: AuditAssistant-*
          path: release-assets
          merge-multiple: true
      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Published release preserved; use a new version tag"'
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "AuditAssistant $RELEASE_TAG" --notes-file RELEASE_NOTES.md release-assets/*
          fi
