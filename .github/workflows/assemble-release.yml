name: Assemble release from verified build

on:
  push:
    branches: [main]
    paths: ['.github/workflows/assemble-release.yml']
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful desktop-build run ID
        required: true
        default: '44562009448'
      release_tag:
        description: Draft pre-release version
        required: true
        default: v0.1.0

permissions:
  actions: read
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id || '44562009448' }}
      RELEASE_TAG: ${{ inputs.release_tag || 'v0.1.0' }}
    steps:
      - name: Validate successful source build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          python - <<'PY'
          import json,os,re
          run=json.load(open('run.json'))
          assert run['conclusion']=='success', 'Build must have completed successfully'
          assert run['head_repository']['full_name']==os.environ['GH_REPO'], 'Wrong source repository'
          assert run['head_branch']=='main' and run['event']=='push', 'Use a main-branch push build'
          assert run['path']=='.github/workflows/build-desktop.yml', 'Wrong build workflow'
          assert re.fullmatch(r'v\d+\.\d+\.\d+',os.environ['RELEASE_TAG']), 'Invalid release version'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+run['head_sha']+'\n')
          PY
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
          pattern: AuditAssistant-*
          merge-multiple: true
          path: release-assets
      - name: Validate version and package checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os,runpy
          from pathlib import Path
          version=runpy.run_path('version.py')['VERSION']
          assert os.environ['RELEASE_TAG']=='v'+version, 'Tag must match the built version'
          files=Path('release-assets')
          names={f'AuditAssistant-{version}-Windows-x64.exe',f'AuditAssistant-{version}-macOS-arm64.dmg'}
          assert {p.name for p in files.iterdir()}==names|{n+'.sha256' for n in names}, 'Expected exactly two packages and two checksums'
          for name in names:
              digest,listed=(files/(name+'.sha256')).read_text().strip().split('  ',1)
              assert listed==name and hashlib.sha256((files/name).read_bytes()).hexdigest()==digest, 'Checksum mismatch'
          print('Both native packages and checksums verified.')
          PY
      - name: Assemble draft only
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Published release preserved"'
            gh release edit "$RELEASE_TAG" --title "Audit Assistant $RELEASE_TAG" --notes-file RELEASE_NOTES.md --prerelease
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" --target "$BUILD_SHA" --draft --prerelease --title "Audit Assistant $RELEASE_TAG" --notes-file RELEASE_NOTES.md release-assets/*
          fi
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
      - name: Confirm uploaded release files
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft,url,assets > uploaded.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.load(open('uploaded.json'));assert d['isDraft'], 'Publication must remain manual'
          expected={p.name:p.stat().st_size for p in Path('release-assets').iterdir()}
          actual={a['name']:a['size'] for a in d['assets']}
          assert actual==expected, 'Uploaded release assets differ from verified build'
          print(d['url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Draft pre-release ready: '+d['url']+'\n\nBoth packages and checksums uploaded. Review and publish manually.\n')
          PY
